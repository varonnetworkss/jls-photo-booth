<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#fff7c7" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="정상네컷" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.json" />
  <title>정상네컷</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; width: 100%; min-height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
      background: #fff7c7; color: #111; touch-action: manipulation;
    }
    body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    .app {
      width: 100vw; height: 100dvh; display: grid; grid-template-columns: 1.18fr 0.82fr;
      gap: 16px; padding: 16px;
      background: linear-gradient(135deg, #fff8d7, #ffffff);
    }
    .camera-panel, .result-panel {
      min-height: 0; border-radius: 28px; background: rgba(255,255,255,0.92);
      box-shadow: 0 16px 40px rgba(15,23,42,.14); overflow: hidden;
    }
    .app.shooting-mode {
  grid-template-columns: 1fr;
  height: 100dvh;
  padding: 10px;
}

.app.shooting-mode .result-panel {
  display: none;
}

.app.shooting-mode .camera-panel {
  height: calc(100dvh - 20px);
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: 12px;
}

.app.shooting-mode .camera-wrap {
  height: 100%;
  aspect-ratio: auto;
}

.app.shooting-mode .thumbs {
  display: none;
}

.app.shooting-mode .top-title h1 {
  font-size: clamp(34px, 7vw, 56px);
}

.app.shooting-mode .controls {
  grid-template-columns: 1fr 1fr;
}
    .camera-panel { display: grid; grid-template-rows: auto 1fr auto auto; padding: 18px; gap: 14px; }
    .top-title { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .top-title h1 { margin: 0; color: #111; font-size: clamp(34px,5vw,56px); line-height: 1; letter-spacing: -1px; font-weight: 1000; }
    .top-title span { border-radius: 999px; padding: 10px 14px; color: #fff; background: #111; font-weight: 1000; font-size: 14px; white-space: nowrap; }
    .camera-wrap { position: relative; min-height: 0; border-radius: 26px; overflow: hidden; background: #020617; border: 6px solid #111; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
    .status { position: absolute; left: 16px; bottom: 16px; z-index: 3; padding: 9px 13px; border-radius: 999px; background: rgba(15,23,42,.72); color: #fff; font-size: 13px; font-weight: 900; }
    .countdown { position: absolute; inset: 0; z-index: 5; display: none; align-items: center; justify-content: center; background: rgba(15,23,42,.38); color: #fff; font-size: clamp(90px,18vw,220px); font-weight: 1000; text-shadow: 0 12px 30px rgba(0,0,0,.45); }
    .countdown.show { display:flex; animation: pop .24s ease both; }
    @keyframes pop { from { transform: scale(.82); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .flash { position:absolute; inset:0; z-index:6; background:#fff; opacity:0; pointer-events:none; }
    .flash.on { animation: flash .28s ease; }
    @keyframes flash { 0%{opacity:0;}35%{opacity:.95;}100%{opacity:0;} }
    .controls { display:grid; grid-template-columns: 1.25fr 1fr 1fr 1fr; gap:10px; }
    button {
      border:0; border-radius:16px; min-height:56px; padding:13px 14px; font-size:16px; font-weight:1000;
      color:#fff; background:#111; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; text-align:center;
      box-shadow:0 10px 20px rgba(0,0,0,.14);
    }
    button.secondary { background:#f1f1f1; color:#111; box-shadow:none; }
    button:disabled { opacity:.42; cursor:not-allowed; }
    .thumbs { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
    .thumb { aspect-ratio:4/3; border-radius:14px; background:#e5e7eb; overflow:hidden; border:3px solid #fff; }
    .thumb img { width:100%; height:100%; object-fit:cover; transform:scaleX(-1); display:block; }
    .result-panel { display:grid; grid-template-rows:auto 1fr auto; padding:18px; gap:12px; }
    .result-top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .result-panel h2 { margin:0; color:#111; letter-spacing:-.04em; font-size:24px; }
    .upload-badge { border-radius:999px; background:#f8fafc; color:#64748b; padding:8px 12px; font-size:12px; font-weight:900; }
    .strip-wrap { min-height:0; display:flex; align-items:center; justify-content:center; }
    .photo-strip { height:100%; max-height:100%; aspect-ratio:3/4; border-radius:22px; overflow:hidden; background:#fff; box-shadow:0 14px 32px rgba(15,23,42,.16); border: 4px solid #111; }
    canvas { width:100%; height:100%; display:block; background:transparent; }
    .qr-area { display:none; grid-template-columns:1fr 1fr; gap:10px; }
    .qr-area.show { display:grid; }
    .qr-card { border-radius:18px; background:#f8fafc; padding:12px; text-align:center; }
    .qr-card h3 { margin:0 0 8px; color:#111; font-size:15px; }
    .qr-card img { width:132px; height:132px; border-radius:12px; background:#fff; border:6px solid #fff; }
    .qr-card a { display:block; margin-top:8px; color:#2563eb; font-size:12px; font-weight:900; text-decoration:none; word-break:break-all; }
    .mini-guide { border-radius:18px; background:#f8fafc; padding:12px 14px; color:#475569; font-size:13px; line-height:1.45; font-weight:800; }
    .mini-guide strong { color:#111; }
    .hidden-canvas { display:none; }
    @media (orientation: portrait), (max-width: 820px) {
      html, body { overflow:auto; }
      .app { height:auto; min-height:100dvh; grid-template-columns:1fr; overflow:auto; }
      .camera-wrap { aspect-ratio:4/3; }
      .controls { grid-template-columns:1fr 1fr; }
      .photo-strip { width:min(92vw,520px); height:auto; }
      .qr-area { grid-template-columns:1fr; }
    }
    @media print {
      html, body { overflow:visible; background:white; }
      .app { display:block; height:auto; padding:0; background:white; }
      .camera-panel, .result-top, .mini-guide, .qr-area { display:none !important; }
      .result-panel { display:block; padding:0; box-shadow:none; background:white; }
      .strip-wrap { display:block; }
      .photo-strip { width:100mm; height:auto; margin:0 auto; box-shadow:none; border-radius:0; border:0; }
      @page { size:A4 portrait; margin:8mm; }
    }
    .app.shooting-mode {
  grid-template-columns: 1fr;
}

.app.shooting-mode .result-panel {
  display: none;
}

.app.result-mode {
  grid-template-columns: 1fr;
}

.app.result-mode .camera-panel {
  display: none;
}

.app.result-mode .result-panel {
  max-width: 980px;
  width: min(980px, calc(100vw - 32px));
  margin: 0 auto;
}

.frame-select {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.frame-select button {
  min-height: 44px;
  border-radius: 999px;
  font-size: 14px;
}
  </style>
</head>
<body>
 <div class="app shooting-mode" id="app">
    <section class="camera-panel">
      <div class="top-title">
        <h1>정상네컷</h1>
        <span>MARKET DAY</span>
      </div>
      <div class="camera-wrap">
        <video id="video" autoplay playsinline muted></video>
        <div id="countdown" class="countdown">3</div>
        <div id="flash" class="flash"></div>
        <div id="cameraStatus" class="status">촬영 버튼을 눌러 시작</div>
      </div>
      <div class="controls">
        <button onclick="goFullscreen()">전체화면</button>
        <button id="startBtn" type="button">촬영 시작</button>
        <button id="retakeBtn" class="secondary" type="button">다시 찍기</button>
        <button id="saveBtn" class="secondary" type="button" disabled>저장</button>
        <button id="printBtn" class="secondary" type="button" disabled>인쇄</button>
      </div>
      <div class="thumbs" id="thumbs"></div>
    </section>

    <section class="result-panel">
     <div class="result-top">
  <h2>완성 미리보기</h2>
  <div style="display:flex; gap:8px; align-items:center;">
    <button type="button" class="secondary" onclick="backToCamera()" style="min-height:40px; padding:8px 14px;">이전으로</button>
    <div id="uploadStatus" class="upload-badge">QR 대기 중</div>
  </div>
</div>
      <div class="strip-wrap">
        <div class="photo-strip">
          <canvas id="stripCanvas" width="1200" height="1600"></canvas>
        </div>
      </div>
      <div id="qrArea" class="qr-area">
        <div class="qr-card">
          <h3>사진 받기</h3>
          <img id="photoQr" alt="사진 QR" />
          <a id="photoLink" href="#" target="_blank" rel="noopener">사진 링크</a>
        </div>
        <div class="qr-card">
          <h3>영상 받기</h3>
          <img id="videoQr" alt="영상 QR" />
          <a id="videoLink" href="#" target="_blank" rel="noopener">영상 링크</a>
        </div>
      </div>
      <div class="mini-guide">
        영상 QR은 생카메라가 아니라 <strong>프레임 안에 합성된 네컷 영상</strong>으로 저장됨.
      </div>
    </section>
  </div>

  <canvas id="captureCanvas" class="hidden-canvas"></canvas>
  <canvas id="videoCanvas" class="hidden-canvas" width="1200" height="1600"></canvas>

  <script>
    const CLOUD_NAME = "dr4ug8q43";
    const UPLOAD_PRESET = "jls_booth";
    const CLOUDINARY_UPLOAD_URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`;

    const video = document.getElementById("video");
    const startBtn = document.getElementById("startBtn");
    const retakeBtn = document.getElementById("retakeBtn");
    const saveBtn = document.getElementById("saveBtn");
    const printBtn = document.getElementById("printBtn");
    const countdownEl = document.getElementById("countdown");
    const flashEl = document.getElementById("flash");
    const cameraStatus = document.getElementById("cameraStatus");
    const uploadStatus = document.getElementById("uploadStatus");
    const thumbs = document.getElementById("thumbs");
    const stripCanvas = document.getElementById("stripCanvas");
    const stripCtx = stripCanvas.getContext("2d");
    const captureCanvas = document.getElementById("captureCanvas");
    const captureCtx = captureCanvas.getContext("2d");
    const videoCanvas = document.getElementById("videoCanvas");
    const videoCtx = videoCanvas.getContext("2d");
    const qrArea = document.getElementById("qrArea");
    const photoQr = document.getElementById("photoQr");
    const videoQr = document.getElementById("videoQr");
    const photoLink = document.getElementById("photoLink");
    const videoLink = document.getElementById("videoLink");

    const CANVAS_W = 1200;
    const CANVAS_H = 1600;

    let photos = [];
    let frameImage = null;
    let isShooting = false;
    let streamStarted = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let videoAnimationId = null;
    let liveSlotIndex = 0;

    const photoSlots = [
      { x: 105, y: 250, w: 460, h: 440 },
      { x: 635, y: 250, w: 460, h: 440 },
      { x: 105, y: 760, w: 460, h: 440 },
      { x: 635, y: 760, w: 460, h: 440 }
    ];

    function wait(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

    function roundRect(ctx, x, y, w, h, r, fill, stroke) {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      ctx.beginPath();
      ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
      if (fill) ctx.fill(); if (stroke) ctx.stroke();
    }

    async function initCamera() {
      if (streamStarted) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1920 }, height: { ideal: 1080 }, facingMode: "user" },
          audio: false
        });
        video.srcObject = stream;
        streamStarted = true;
        cameraStatus.textContent = "카메라 준비 완료";
      } catch (err) {
        cameraStatus.textContent = "카메라 권한 필요";
        alert("카메라 권한을 허용해야 촬영할 수 있어.");
      }
    }

    function getSupportedMimeType() {
      const types = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm", "video/mp4"];
      return types.find(type => window.MediaRecorder && MediaRecorder.isTypeSupported(type)) || "";
    }

    function drawCoverImage(ctx, img, x, y, w, h, mirrored = false) {
      const iw = img.videoWidth || img.width;
      const ih = img.videoHeight || img.height;
      if (!iw || !ih) return;
      const scale = Math.max(w / iw, h / ih);
      const sw = w / scale, sh = h / scale;
      const sx = (iw - sw) / 2, sy = (ih - sh) / 2;
      ctx.save();
      if (mirrored) { ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h); }
      else { ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h); }
      ctx.restore();
    }

    function drawBaseFrame(ctx, showNumbers = true) {
      ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
      const bg = ctx.createLinearGradient(0, 0, CANVAS_W, CANVAS_H);
      bg.addColorStop(0, "#fff8d7"); bg.addColorStop(1, "#ffffff");
      ctx.fillStyle = bg; ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.fillStyle = "rgba(250,204,21,.32)";
      for (let y = 30; y < CANVAS_H; y += 78) for (let x = 36; x < CANVAS_W; x += 78) { ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2); ctx.fill(); }
      ctx.textAlign = "center"; ctx.fillStyle = "#111"; ctx.font = "1000 78px Arial"; ctx.fillText("정상네컷", CANVAS_W / 2, 120);
      ctx.fillStyle = "#111"; ctx.font = "800 30px Arial"; ctx.fillText("JLS MARKET DAY", CANVAS_W / 2, 165);
      photoSlots.forEach((slot, idx) => {
        ctx.save(); ctx.lineWidth = 18; ctx.strokeStyle = idx % 2 === 0 ? "#2f8f2f" : "#00a6d6"; ctx.fillStyle = "#fff";
        roundRect(ctx, slot.x - 12, slot.y - 12, slot.w + 24, slot.h + 24, 34, true, false);
        roundRect(ctx, slot.x, slot.y, slot.w, slot.h, 24, false, true); ctx.restore();
        if (showNumbers && !photos[idx]) { ctx.fillStyle = "#cbd5e1"; ctx.font = "900 46px Arial"; ctx.fillText(String(idx + 1), slot.x + slot.w / 2, slot.y + slot.h / 2 + 16); }
      });
      ctx.fillStyle = "#111"; ctx.font = "900 42px Arial"; ctx.fillText("SEO SUWON JLS", CANVAS_W / 2, 1478);
      ctx.fillStyle = "#64748b"; ctx.font = "700 26px Arial"; ctx.fillText(new Date().toLocaleDateString("ko-KR"), CANVAS_W / 2, 1522);
    }

    function drawPhotoIntoSlot(ctx, src, idx) {
      return new Promise(resolve => {
        if (!src) { resolve(); return; }
        const img = new Image();
        img.onload = () => {
          const slot = photoSlots[idx];
          ctx.save(); roundRect(ctx, slot.x, slot.y, slot.w, slot.h, 22, false, false); ctx.clip();
          drawCoverImage(ctx, img, slot.x, slot.y, slot.w, slot.h, true); ctx.restore(); resolve();
        };
        img.onerror = resolve; img.src = src;
      });
    }

    async function renderStrip() {
      drawBaseFrame(stripCtx, true);
      for (let i = 0; i < photos.length; i++) await drawPhotoIntoSlot(stripCtx, photos[i], i);
      if (frameImage) stripCtx.drawImage(frameImage, 0, 0, CANVAS_W, CANVAS_H);
    }

    function drawVideoCompositeFrame() {
      drawBaseFrame(videoCtx, false);

      // 이미 찍힌 컷은 고정 사진으로 표시
      photos.forEach((src, idx) => {
        const img = new Image();
        img.onload = () => {
          const slot = photoSlots[idx];
          videoCtx.save(); roundRect(videoCtx, slot.x, slot.y, slot.w, slot.h, 22, false, false); videoCtx.clip();
          drawCoverImage(videoCtx, img, slot.x, slot.y, slot.w, slot.h, true); videoCtx.restore();
          if (frameImage) videoCtx.drawImage(frameImage, 0, 0, CANVAS_W, CANVAS_H);
        };
        img.src = src;
      });

      // 현재 촬영 중인 칸에는 라이브 카메라를 넣음
if (liveSlotIndex >= 0) {
  const slot = photoSlots[liveSlotIndex] || photoSlots[3];
  videoCtx.save();
  roundRect(videoCtx, slot.x, slot.y, slot.w, slot.h, 22, false, false);
  videoCtx.clip();
  drawCoverImage(videoCtx, video, slot.x, slot.y, slot.w, slot.h, true);
  videoCtx.restore();
}

      if (frameImage) videoCtx.drawImage(frameImage, 0, 0, CANVAS_W, CANVAS_H);
    }

    function startCompositeLoop() {
      function loop() {
        drawVideoCompositeFrame();
        videoAnimationId = requestAnimationFrame(loop);
      }
      loop();
    }

    function stopCompositeLoop() {
      if (videoAnimationId) cancelAnimationFrame(videoAnimationId);
      videoAnimationId = null;
    }

    function startCompositeRecording() {
      recordedChunks = [];
      if (!window.MediaRecorder || !videoCanvas.captureStream) return;
      try {
        const canvasStream = videoCanvas.captureStream(30);
        const mimeType = getSupportedMimeType();
        mediaRecorder = new MediaRecorder(canvasStream, mimeType ? { mimeType } : undefined);
        mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.start();
      } catch (err) {
        mediaRecorder = null;
      }
    }

    function stopCompositeRecording() {
      return new Promise(resolve => {
        if (!mediaRecorder || mediaRecorder.state === "inactive") { resolve(null); return; }
        mediaRecorder.onstop = () => {
          const type = mediaRecorder.mimeType || "video/webm";
          resolve(new Blob(recordedChunks, { type }));
        };
        mediaRecorder.stop();
      });
    }

    function updateThumbs() {
      thumbs.innerHTML = "";
      for (let i = 0; i < 4; i++) {
        const div = document.createElement("div"); div.className = "thumb";
        if (photos[i]) { const img = document.createElement("img"); img.src = photos[i]; div.appendChild(img); }
        thumbs.appendChild(div);
      }
    }

    async function showCountdown() {
      for (const num of [3, 2, 1]) {
        countdownEl.textContent = num; countdownEl.classList.add("show"); await wait(760); countdownEl.classList.remove("show"); await wait(180);
      }
    }

    function fireFlash() { flashEl.classList.remove("on"); void flashEl.offsetWidth; flashEl.classList.add("on"); }

    function capturePhoto() {
      const vw = video.videoWidth, vh = video.videoHeight;
      captureCanvas.width = vw; captureCanvas.height = vh;
      captureCtx.drawImage(video, 0, 0, vw, vh);
      return captureCanvas.toDataURL("image/jpeg", 0.95);
    }

    function canvasToBlob(canvas, type = "image/png", quality = 0.95) {
      return new Promise(resolve => canvas.toBlob(resolve, type, quality));
    }

    async function uploadToCloudinary(fileBlob, fileName) {
      const formData = new FormData();
      formData.append("file", fileBlob, fileName);
      formData.append("upload_preset", UPLOAD_PRESET);
      formData.append("folder", "jls-booth");
      const res = await fetch(CLOUDINARY_UPLOAD_URL, { method: "POST", body: formData });
      if (!res.ok) throw new Error("Cloudinary upload failed");
      const data = await res.json();
      return data.secure_url;
    }

    function makeQrUrl(url) {
      return `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(url)}`;
    }

    function showQr(photoUrl, videoUrl) {
      photoQr.src = makeQrUrl(photoUrl);
      photoLink.href = photoUrl;
      photoLink.textContent = "사진 열기";
      if (videoUrl) {
        videoQr.src = makeQrUrl(videoUrl);
        videoLink.href = videoUrl;
        videoLink.textContent = "영상 열기";
      } else {
        videoQr.removeAttribute("src");
        videoLink.href = "#";
        videoLink.textContent = "영상 저장 실패";
      }
      qrArea.classList.add("show");
    }

    async function uploadResult(videoBlob) {
      try {
        uploadStatus.textContent = "업로드 중...";
        await renderStrip();
        const photoBlob = await canvasToBlob(stripCanvas, "image/png", 0.95);
        const stamp = Date.now();
        const photoPromise = uploadToCloudinary(photoBlob, `jls-photo-${stamp}.png`);
        const videoPromise = videoBlob ? uploadToCloudinary(videoBlob, `jls-frame-video-${stamp}.webm`).catch(() => null) : Promise.resolve(null);
        const [photoUrl, videoUrl] = await Promise.all([photoPromise, videoPromise]);
        showQr(photoUrl, videoUrl);
        uploadStatus.textContent = "QR 생성 완료";
      } catch (err) {
        uploadStatus.textContent = "업로드 실패";
        alert("업로드 실패. 인터넷 연결이나 Cloudinary preset을 확인해줘.");
      }
    }

    async function startShooting() {
      if (isShooting) return;
      await initCamera(); if (!streamStarted) return;
      isShooting = true; startBtn.disabled = true; saveBtn.disabled = true; printBtn.disabled = true;
      qrArea.classList.remove("show"); uploadStatus.textContent = "촬영 중";
      photos = []; updateThumbs(); await renderStrip();

      liveSlotIndex = 0;
      startCompositeLoop();
      startCompositeRecording();

      for (let i = 0; i < 4; i++) {
        liveSlotIndex = i;
        cameraStatus.textContent = `${i + 1}번째 컷 준비`;
        await showCountdown();
        fireFlash();
        photos.push(capturePhoto());
        updateThumbs();
        await renderStrip();
        cameraStatus.textContent = `${i + 1}번째 컷 완료`;
        await wait(680);
      }

    liveSlotIndex = -1;
await wait(3000);

const videoBlob = await stopCompositeRecording();
stopCompositeLoop();

      await renderStrip();
      saveBtn.disabled = false; printBtn.disabled = false; startBtn.disabled = false; isShooting = false;
cameraStatus.textContent = "촬영 완료";
showResultScreen();
uploadResult(videoBlob);
    }

    function resetPhotos() {
      photos = []; saveBtn.disabled = true; printBtn.disabled = true; qrArea.classList.remove("show"); uploadStatus.textContent = "QR 대기 중";
      updateThumbs(); renderStrip(); cameraStatus.textContent = "다시 촬영 가능";
    }

    async function saveImage() {
      await renderStrip();
      const link = document.createElement("a");
      const now = new Date();
      const stamp = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}${String(now.getDate()).padStart(2,"0")}-${String(now.getHours()).padStart(2,"0")}${String(now.getMinutes()).padStart(2,"0")}`;
      link.download = `jungsang-4cut-${stamp}.png`;
      link.href = stripCanvas.toDataURL("image/png");
      link.click();
    }

    function tryLoadDefaultFrame() {
      const img = new Image();
      img.onload = () => { frameImage = img; renderStrip(); };
      img.onerror = () => { frameImage = null; renderStrip(); };
      img.src = "./frame.png?v=" + Date.now();
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
    }

    startBtn.addEventListener("click", startShooting);
    retakeBtn.addEventListener("click", resetPhotos);
    saveBtn.addEventListener("click", saveImage);
    printBtn.addEventListener("click", () => window.print());
function goFullscreen() {
  const el = document.documentElement;
  if (el.requestFullscreen) {
    el.requestFullscreen();
  } else if (el.webkitRequestFullscreen) {
    el.webkitRequestFullscreen();
  }
}
    function showResultScreen() {
  document.getElementById("app").classList.remove("shooting-mode");
  document.getElementById("app").classList.add("result-mode");
}

function backToCamera() {
  document.getElementById("app").classList.remove("result-mode");
  document.getElementById("app").classList.add("shooting-mode");
}
