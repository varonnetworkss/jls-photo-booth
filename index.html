<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#fff8d7" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="정상네컷" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.json" />
  <title>정상네컷</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
      background: #fff8d7;
      color: #111;
      touch-action: manipulation;
    }

    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .app {
      width: 100vw;
      height: 100dvh;
      background: linear-gradient(135deg, #fff8d7, #ffffff);
      padding: 10px;
    }

    .screen {
      width: 100%;
      height: 100%;
      display: none;
    }

    .screen.active {
      display: grid;
    }

    .shooting-screen {
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      background: rgba(255,255,255,0.92);
      border-radius: 26px;
      padding: 12px;
      box-shadow: 0 14px 36px rgba(15,23,42,.12);
    }

    .top-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .top-title h1 {
      margin: 0;
      font-size: clamp(36px, 8vw, 68px);
      line-height: 1;
      letter-spacing: -2px;
      font-weight: 1000;
      color: #111;
    }

    .top-title span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 13px;
      border-radius: 999px;
      background: #111;
      color: white;
      font-size: 13px;
      font-weight: 1000;
      white-space: nowrap;
    }

    .camera-wrap {
      position: relative;
      min-height: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020617;
      border: 6px solid #111;
      border-radius: 24px;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: block;
    }

    .status {
      position: absolute;
      left: 14px;
      bottom: 14px;
      z-index: 4;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(15,23,42,.72);
      color: white;
      font-size: 13px;
      font-weight: 900;
    }

    .countdown {
      position: absolute;
      inset: 0;
      z-index: 6;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.35);
      color: white;
      font-size: clamp(110px, 24vw, 260px);
      font-weight: 1000;
      text-shadow: 0 12px 30px rgba(0,0,0,.5);
    }

    .countdown.show {
      display: flex;
      animation: pop .22s ease both;
    }

    @keyframes pop {
      from { transform: scale(.78); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .flash {
      position: absolute;
      inset: 0;
      z-index: 7;
      background: white;
      opacity: 0;
      pointer-events: none;
    }

    .flash.on {
      animation: flash .28s ease;
    }

    @keyframes flash {
      0% { opacity: 0; }
      35% { opacity: .96; }
      100% { opacity: 0; }
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      border: 0;
      min-height: 54px;
      border-radius: 16px;
      padding: 12px 14px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: 1000;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,.14);
    }

    button.secondary {
      background: #f1f1f1;
      color: #111;
      box-shadow: none;
    }

    button:disabled {
      opacity: .38;
      cursor: not-allowed;
    }

    .result-screen {
      grid-template-rows: auto auto 1fr auto;
      gap: 10px;
      background: rgba(255,255,255,0.92);
      border-radius: 26px;
      padding: 12px;
      box-shadow: 0 14px 36px rgba(15,23,42,.12);
    }

    .result-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .result-top h2 {
      margin: 0;
      font-size: clamp(22px, 5vw, 34px);
      font-weight: 1000;
      letter-spacing: -1px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .small-btn {
      min-height: 40px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
    }

    .upload-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #f8fafc;
      color: #64748b;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .frame-select {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .frame-select button {
      min-height: 38px;
      border-radius: 999px;
      padding: 7px 8px;
      font-size: 12px;
      box-shadow: none;
      background: #f1f1f1;
      color: #111;
      border: 2px solid transparent;
    }

    .frame-select button.active-frame {
      background: #111;
      color: white;
      border-color: #111;
    }

    .strip-wrap {
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-strip {
      height: 100%;
      max-height: 100%;
      aspect-ratio: 3 / 4;
      border: 4px solid #111;
      border-radius: 22px;
      overflow: hidden;
      background: white;
      box-shadow: 0 14px 32px rgba(15,23,42,.15);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: white;
    }

    .bottom-area {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .qr-card {
      display: none;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 18px;
      background: #f8fafc;
    }

    .qr-card.show {
      display: grid;
    }

    .qr-card img {
      width: 104px;
      height: 104px;
      border-radius: 12px;
      background: white;
      border: 5px solid white;
    }

    .qr-text h3 {
      margin: 0 0 5px;
      font-size: 16px;
      font-weight: 1000;
    }

    .qr-text a {
      color: #2563eb;
      font-size: 13px;
      font-weight: 900;
      text-decoration: none;
    }

    .guide {
      font-size: 12px;
      line-height: 1.4;
      color: #64748b;
      font-weight: 800;
      text-align: center;
    }

    .hidden-canvas {
      display: none;
    }

    @media (orientation: portrait), (max-width: 820px) {
      .photo-strip {
        width: min(92vw, 560px);
        height: auto;
      }
      .frame-select {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media print {
      html, body {
        overflow: visible;
        background: white;
      }
      .app {
        display: block;
        height: auto;
        padding: 0;
        background: white;
      }
      .shooting-screen, .result-top, .frame-select, .bottom-area {
        display: none !important;
      }
      .result-screen {
        display: block !important;
        padding: 0;
        box-shadow: none;
        background: white;
      }
      .strip-wrap {
        display: block;
      }
      .photo-strip {
        width: 100mm;
        height: auto;
        margin: 0 auto;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      @page {
        size: A4 portrait;
        margin: 8mm;
      }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <section class="screen shooting-screen active" id="shootingScreen">
      <div class="top-title">
        <h1>정상네컷</h1>
        <span>MARKET DAY</span>
      </div>

      <div class="camera-wrap">
        <video id="video" autoplay playsinline muted></video>
        <div id="countdown" class="countdown">3</div>
        <div id="flash" class="flash"></div>
        <div id="cameraStatus" class="status">촬영 버튼을 눌러 시작</div>
      </div>

      <div class="controls">
        <button type="button" onclick="goFullscreen()">전체화면</button>
        <button id="startBtn" type="button">촬영 시작</button>
        <button id="retakeBtn" class="secondary" type="button">초기화</button>
        <button id="saveBtn" class="secondary" type="button" disabled>저장</button>
      </div>
    </section>

    <section class="screen result-screen" id="resultScreen">
      <div class="result-top">
        <h2>완성 미리보기</h2>
        <div class="top-actions">
          <button type="button" class="secondary small-btn" onclick="backToCamera()">이전으로</button>
          <span id="uploadStatus" class="upload-badge">QR 대기 중</span>
        </div>
      </div>

      <div class="frame-select" id="frameSelect">
        <button type="button" data-frame="frame-yellow" class="active-frame">노랑</button>
        <button type="button" data-frame="frame-green">초록</button>
        <button type="button" data-frame="frame-pink-bear">핑크곰</button>
        <button type="button" data-frame="frame-blue-flower">하늘꽃</button>
        <button type="button" data-frame="frame-cute-jls">CUTE</button>
      </div>

      <div class="strip-wrap">
        <div class="photo-strip">
          <canvas id="stripCanvas" width="1200" height="1600"></canvas>
        </div>
      </div>

      <div class="bottom-area">
        <div id="qrCard" class="qr-card">
          <img id="photoQr" alt="사진 QR" />
          <div class="qr-text">
            <h3>사진 받기</h3>
            <a id="photoLink" href="#" target="_blank" rel="noopener">사진 열기</a>
          </div>
        </div>
        <div class="guide">프레임을 고르면 미리보기와 QR 사진이 다시 생성됨.</div>
      </div>
    </section>
  </div>

  <canvas id="captureCanvas" class="hidden-canvas"></canvas>

  <script>
    const CLOUD_NAME = "dr4ug8q43";
    const UPLOAD_PRESET = "jls_booth";
    const CLOUDINARY_UPLOAD_URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;

    const video = document.getElementById("video");
    const startBtn = document.getElementById("startBtn");
    const retakeBtn = document.getElementById("retakeBtn");
    const saveBtn = document.getElementById("saveBtn");
    const countdownEl = document.getElementById("countdown");
    const flashEl = document.getElementById("flash");
    const cameraStatus = document.getElementById("cameraStatus");
    const uploadStatus = document.getElementById("uploadStatus");
    const shootingScreen = document.getElementById("shootingScreen");
    const resultScreen = document.getElementById("resultScreen");
    const stripCanvas = document.getElementById("stripCanvas");
    const stripCtx = stripCanvas.getContext("2d");
    const captureCanvas = document.getElementById("captureCanvas");
    const captureCtx = captureCanvas.getContext("2d");
    const qrCard = document.getElementById("qrCard");
    const photoQr = document.getElementById("photoQr");
    const photoLink = document.getElementById("photoLink");
    const frameSelect = document.getElementById("frameSelect");

    const CANVAS_W = 1200;
    const CANVAS_H = 1600;

    const FRAME_CONFIGS = {
      "frame-yellow": {
        file: "frame-yellow.png",
        slots: [
          { x: 216, y: 337, w: 379, h: 493 },
          { x: 613, y: 337, w: 379, h: 493 },
          { x: 216, y: 846, w: 379, h: 493 },
          { x: 613, y: 846, w: 379, h: 493 }
        ]
      },
      "frame-green": {
        file: "frame-green.png",
        slots: [
          { x: 76, y: 103, w: 505, h: 598 },
          { x: 620, y: 103, w: 505, h: 598 },
          { x: 76, y: 752, w: 505, h: 598 },
          { x: 620, y: 752, w: 505, h: 598 }
        ]
      },
      "frame-pink-bear": {
        file: "frame-pink-bear.png",
        slots: [
          { x: 147, y: 429, w: 434, h: 497 },
          { x: 627, y: 88, w: 450, h: 536 },
          { x: 147, y: 1005, w: 434, h: 530 },
          { x: 627, y: 683, w: 450, h: 530 }
        ]
      },
      "frame-blue-flower": {
        file: "frame-blue-flower.png",
        slots: [
          { x: 80, y: 86, w: 503, h: 618 },
          { x: 621, y: 86, w: 503, h: 618 },
          { x: 80, y: 754, w: 503, h: 618 },
          { x: 621, y: 754, w: 503, h: 618 }
        ]
      },
      "frame-cute-jls": {
        file: "frame-cute-jls.png",
        slots: [
          { x: 80, y: 42, w: 455, h: 512 },
          { x: 547, y: 42, w: 555, h: 512 },
          { x: 80, y: 585, w: 455, h: 512 },
          { x: 547, y: 585, w: 555, h: 512 }
        ]
      }
    };

    let selectedFrame = "frame-yellow";
    let photos = [];
    let frameImage = null;
    let isShooting = false;
    let streamStarted = false;
    let uploadTimer = null;

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function goFullscreen() {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    }

    function showResultScreen() {
      shootingScreen.classList.remove("active");
      resultScreen.classList.add("active");
    }

    function backToCamera() {
      resultScreen.classList.remove("active");
      shootingScreen.classList.add("active");
    }

    async function initCamera() {
      try {
        cameraStatus.textContent = "카메라 연결 중...";

        if (video.srcObject) {
          streamStarted = true;
          await video.play();
          cameraStatus.textContent = "카메라 준비 완료";
          return;
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: "user"
          },
          audio: false
        });

        video.srcObject = stream;

        await new Promise(resolve => {
          video.onloadedmetadata = resolve;
        });

        await video.play();

        streamStarted = true;
        cameraStatus.textContent = "카메라 준비 완료";
      } catch (err) {
        console.error(err);
        streamStarted = false;
        cameraStatus.textContent = "카메라 실행 실패";
        alert("카메라가 안 켜졌어. 브라우저 카메라 권한을 허용하고 새로고침해줘.");
      }
    }

    function roundRect(ctx, x, y, w, h, r, fill, stroke) {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }

    function drawCoverImage(ctx, img, x, y, w, h, mirrored = false) {
      const iw = img.videoWidth || img.width;
      const ih = img.videoHeight || img.height;
      if (!iw || !ih) return;

      const scale = Math.max(w / iw, h / ih);
      const sw = w / scale;
      const sh = h / scale;
      const sx = (iw - sw) / 2;
      const sy = (ih - sh) / 2;

      ctx.save();
      if (mirrored) {
        ctx.translate(x + w, y);
        ctx.scale(-1, 1);
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
      } else {
        ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
      }
      ctx.restore();
    }

    function loadImage(src) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    async function loadFrame(frameKey) {
      const config = FRAME_CONFIGS[frameKey];
      frameImage = await loadImage(`./${config.file}?v=${Date.now()}`);
      await renderStrip();
    }

    function drawFallbackFrame() {
      stripCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);
      stripCtx.fillStyle = "#ffffff";
      stripCtx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      stripCtx.fillStyle = "#fff8d7";
      stripCtx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      stripCtx.textAlign = "center";
      stripCtx.fillStyle = "#111";
      stripCtx.font = "1000 78px Arial";
      stripCtx.fillText("정상네컷", CANVAS_W / 2, 120);
      stripCtx.font = "800 30px Arial";
      stripCtx.fillText("JLS MARKET DAY", CANVAS_W / 2, 165);
    }

    async function renderStrip() {
      stripCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);

      if (frameImage) {
        stripCtx.drawImage(frameImage, 0, 0, CANVAS_W, CANVAS_H);
      } else {
        drawFallbackFrame();
      }

      const slots = FRAME_CONFIGS[selectedFrame].slots;
      for (let i = 0; i < photos.length; i++) {
        const img = await loadImage(photos[i]);
        if (!img) continue;
        const slot = slots[i];
        stripCtx.save();
        roundRect(stripCtx, slot.x, slot.y, slot.w, slot.h, 10, false, false);
        stripCtx.clip();
        drawCoverImage(stripCtx, img, slot.x, slot.y, slot.w, slot.h, true);
        stripCtx.restore();
      }
    }

    async function showCountdown() {
      for (const num of [3, 2, 1]) {
        countdownEl.textContent = num;
        countdownEl.classList.add("show");
        await wait(760);
        countdownEl.classList.remove("show");
        await wait(160);
      }
    }

    function fireFlash() {
      flashEl.classList.remove("on");
      void flashEl.offsetWidth;
      flashEl.classList.add("on");
    }

    function capturePhoto() {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh) return null;

      captureCanvas.width = vw;
      captureCanvas.height = vh;
      captureCtx.drawImage(video, 0, 0, vw, vh);
      return captureCanvas.toDataURL("image/jpeg", 0.94);
    }

    function canvasToBlob(canvas, type = "image/png", quality = 0.95) {
      return new Promise(resolve => canvas.toBlob(resolve, type, quality));
    }

    async function uploadToCloudinary(blob, fileName) {
      const formData = new FormData();
      formData.append("file", blob, fileName);
      formData.append("upload_preset", UPLOAD_PRESET);
      formData.append("folder", "jls-booth");

      const res = await fetch(CLOUDINARY_UPLOAD_URL, {
        method: "POST",
        body: formData
      });

      if (!res.ok) throw new Error("Cloudinary upload failed");
      const data = await res.json();
      return data.secure_url;
    }

    function makeQrUrl(url) {
      return `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(url)}`;
    }

    async function uploadResult() {
      try {
        uploadStatus.textContent = "업로드 중...";
        qrCard.classList.remove("show");
        await renderStrip();
        const blob = await canvasToBlob(stripCanvas, "image/png", 0.95);
        const url = await uploadToCloudinary(blob, `${selectedFrame}-${Date.now()}.png`);

        photoQr.src = makeQrUrl(url);
        photoLink.href = url;
        photoLink.textContent = "사진 열기 / 저장";
        qrCard.classList.add("show");
        uploadStatus.textContent = "QR 생성 완료";
      } catch (err) {
        console.error(err);
        uploadStatus.textContent = "업로드 실패";
        qrCard.classList.remove("show");
      }
    }

    function scheduleReupload() {
      if (!photos.length) return;
      if (uploadTimer) clearTimeout(uploadTimer);
      uploadStatus.textContent = "QR 다시 생성 중...";
      uploadTimer = setTimeout(uploadResult, 350);
    }

    async function selectFrame(frameKey) {
      selectedFrame = frameKey;
      [...frameSelect.querySelectorAll("button")].forEach(btn => {
        btn.classList.toggle("active-frame", btn.dataset.frame === frameKey);
      });
      await loadFrame(frameKey);
      scheduleReupload();
    }

    async function startShooting() {
      if (isShooting) return;
      await initCamera();
      if (!streamStarted) return;

      isShooting = true;
      startBtn.disabled = true;
      saveBtn.disabled = true;
      qrCard.classList.remove("show");
      uploadStatus.textContent = "QR 대기 중";
      photos = [];
      await renderStrip();

      for (let i = 0; i < 4; i++) {
        cameraStatus.textContent = `${i + 1}번째 컷 준비`;
        await showCountdown();
        fireFlash();
        const shot = capturePhoto();
        if (!shot) {
          isShooting = false;
          startBtn.disabled = false;
          cameraStatus.textContent = "카메라 준비 실패";
          alert("카메라 화면이 아직 준비 안 됐어. 다시 눌러줘.");
          return;
        }
        photos.push(shot);
        await renderStrip();
        cameraStatus.textContent = `${i + 1}번째 컷 완료`;
        await wait(620);
      }

      cameraStatus.textContent = "촬영 완료";
      isShooting = false;
      startBtn.disabled = false;
      saveBtn.disabled = false;

      await renderStrip();
      showResultScreen();
      uploadResult();
    }

    async function resetAll() {
      photos = [];
      qrCard.classList.remove("show");
      uploadStatus.textContent = "QR 대기 중";
      saveBtn.disabled = true;
      await renderStrip();
      backToCamera();
      cameraStatus.textContent = "촬영 버튼을 눌러 시작";
    }

    async function saveImage() {
      await renderStrip();
      const link = document.createElement("a");
      const now = new Date();
      const stamp = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}${String(now.getDate()).padStart(2,"0")}-${String(now.getHours()).padStart(2,"0")}${String(now.getMinutes()).padStart(2,"0")}`;
      link.download = `${selectedFrame}-${stamp}.png`;
      link.href = stripCanvas.toDataURL("image/png");
      link.click();
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }

    frameSelect.addEventListener("click", e => {
      const btn = e.target.closest("button[data-frame]");
      if (!btn) return;
      selectFrame(btn.dataset.frame);
    });

    startBtn.addEventListener("click", startShooting);
    retakeBtn.addEventListener("click", resetAll);
    saveBtn.addEventListener("click", saveImage);

    loadFrame(selectedFrame);
  </script>
</body>
</html>
