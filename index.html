<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JLS Market Day Photo Booth</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #fff8db 0, transparent 32%),
                  radial-gradient(circle at bottom right, #d8f7ff 0, transparent 30%),
                  linear-gradient(135deg, #fff7ef, #f6fbff);
      color: #1f2937;
      min-height: 100vh;
    }

    .app {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
      padding: 22px 24px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 18px 45px rgba(31, 41, 55, 0.12);
      backdrop-filter: blur(16px);
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 48px);
      letter-spacing: -0.05em;
      color: #172554;
    }

    .hero p {
      margin: 8px 0 0;
      color: #64748b;
      font-size: 16px;
      font-weight: 700;
    }

    .badge {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 12px 18px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      font-weight: 900;
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.25);
    }

    .layout {
      display: grid;
      grid-template-columns: 1.25fr 0.75fr;
      gap: 20px;
      align-items: start;
    }

    .panel {
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 18px 45px rgba(31, 41, 55, 0.13);
      padding: 20px;
      overflow: hidden;
    }

    .camera-wrap {
      position: relative;
      border-radius: 26px;
      overflow: hidden;
      background: #0f172a;
      aspect-ratio: 4 / 3;
      border: 8px solid white;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: block;
    }

    .countdown {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.38);
      color: white;
      font-size: clamp(80px, 16vw, 180px);
      font-weight: 1000;
      text-shadow: 0 10px 30px rgba(0,0,0,0.4);
      z-index: 5;
    }

    .countdown.show {
      display: flex;
      animation: pop 0.28s ease both;
    }

    @keyframes pop {
      from { transform: scale(0.82); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .flash {
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 6;
    }

    .flash.on {
      animation: flash 0.28s ease;
    }

    @keyframes flash {
      0% { opacity: 0; }
      35% { opacity: 0.95; }
      100% { opacity: 0; }
    }

    .camera-status {
      position: absolute;
      left: 16px;
      bottom: 16px;
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(15, 23, 42, 0.72);
      color: white;
      font-weight: 800;
      font-size: 13px;
      z-index: 2;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    button, .file-label {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.22);
      transition: transform 0.16s ease, box-shadow 0.16s ease, opacity 0.16s ease;
    }

    button:hover, .file-label:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 30px rgba(37, 99, 235, 0.28);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    button.secondary, .file-label.secondary {
      background: #eef2ff;
      color: #3730a3;
      box-shadow: none;
    }

    button.danger {
      background: #fee2e2;
      color: #b91c1c;
      box-shadow: none;
    }

    input[type="file"] {
      display: none;
    }

    .strip-box {
      display: grid;
      gap: 14px;
    }

    .preview-title {
      margin: 0 0 12px;
      font-size: 22px;
      color: #172554;
      letter-spacing: -0.04em;
    }

    .photo-strip {
      width: min(100%, 360px);
      margin: 0 auto;
      border-radius: 24px;
      overflow: hidden;
      background: white;
      border: 1px solid #e5e7eb;
      box-shadow: 0 18px 42px rgba(15, 23, 42, 0.14);
    }

    canvas {
      width: 100%;
      display: block;
      background: white;
    }

    .thumbs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .thumb {
      aspect-ratio: 4 / 3;
      border-radius: 14px;
      overflow: hidden;
      background: #e5e7eb;
      border: 3px solid white;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.12);
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: block;
    }

    .notice {
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 18px;
      background: #f8fafc;
      color: #475569;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 700;
    }

    .notice strong {
      color: #2563eb;
    }

    .hidden-canvas {
      display: none;
    }

    @media (max-width: 900px) {
      .hero {
        align-items: flex-start;
        flex-direction: column;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .photo-strip {
        max-width: 420px;
      }
    }

    @media print {
      body {
        background: white;
      }
      .hero, .camera-panel, .controls, .notice, .thumbs, .preview-title {
        display: none !important;
      }
      .app, .layout, .panel {
        width: 100%;
        margin: 0;
        padding: 0;
        box-shadow: none;
        background: white;
      }
      .layout {
        display: block;
      }
      .photo-strip {
        width: 100mm;
        margin: 0 auto;
        box-shadow: none;
        border: none;
        border-radius: 0;
      }
      @page {
        size: A4 portrait;
        margin: 8mm;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="hero">
      <div>
        <h1>JLS Market Day<br />Photo Booth</h1>
        <p>광고 없이 바로 찍는 우리 학원 네컷 부스</p>
      </div>
      <div class="badge">LIFE 4 CUT</div>
    </section>

    <main class="layout">
      <section class="panel camera-panel">
        <div class="camera-wrap">
          <video id="video" autoplay playsinline muted></video>
          <div id="countdown" class="countdown">3</div>
          <div id="flash" class="flash"></div>
          <div id="cameraStatus" class="camera-status">카메라 준비 중...</div>
        </div>

        <div class="controls">
          <button id="startBtn" type="button">촬영 시작</button>
          <button id="retakeBtn" class="secondary" type="button">다시 찍기</button>
          <button id="saveBtn" class="secondary" type="button" disabled>이미지 저장</button>
          <button id="printBtn" class="secondary" type="button" disabled>인쇄</button>
          <label class="file-label secondary" for="frameInput">프레임 넣기</label>
          <input id="frameInput" type="file" accept="image/png,image/jpeg,image/webp" />
        </div>

        <div class="thumbs" id="thumbs">
          <div class="thumb"></div>
          <div class="thumb"></div>
          <div class="thumb"></div>
          <div class="thumb"></div>
        </div>

        <div class="notice">
          <strong>프레임 사용법:</strong> 같은 폴더에 <strong>frame.png</strong>를 넣으면 자동 적용됨. 또는 위의 <strong>프레임 넣기</strong> 버튼으로 직접 PNG 파일을 넣어도 됨. 투명 배경 PNG 추천.
        </div>
      </section>

      <section class="panel strip-box">
        <h2 class="preview-title">완성 미리보기</h2>
        <div class="photo-strip">
          <canvas id="stripCanvas" width="1200" height="1800"></canvas>
        </div>
        <div class="notice">
          행사장에서는 크롬으로 열고 <strong>F11 전체화면</strong> 누르면 진짜 부스처럼 보임. 저장된 이미지는 바로 출력하거나 공유 가능.
        </div>
      </section>
    </main>
  </div>

  <canvas id="captureCanvas" class="hidden-canvas"></canvas>

  <script>
    const video = document.getElementById("video");
    const startBtn = document.getElementById("startBtn");
    const retakeBtn = document.getElementById("retakeBtn");
    const saveBtn = document.getElementById("saveBtn");
    const printBtn = document.getElementById("printBtn");
    const countdownEl = document.getElementById("countdown");
    const flashEl = document.getElementById("flash");
    const cameraStatus = document.getElementById("cameraStatus");
    const stripCanvas = document.getElementById("stripCanvas");
    const stripCtx = stripCanvas.getContext("2d");
    const captureCanvas = document.getElementById("captureCanvas");
    const captureCtx = captureCanvas.getContext("2d");
    const thumbs = document.getElementById("thumbs");
    const frameInput = document.getElementById("frameInput");

    let photos = [];
    let frameImage = null;
    let isShooting = false;

    const CANVAS_W = 1200;
    const CANVAS_H = 1800;

    const photoSlots = [
      { x: 120, y: 220, w: 960, h: 300 },
      { x: 120, y: 570, w: 960, h: 300 },
      { x: 120, y: 920, w: 960, h: 300 },
      { x: 120, y: 1270, w: 960, h: 300 }
    ];

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: "user"
          },
          audio: false
        });
        video.srcObject = stream;
        cameraStatus.textContent = "카메라 준비 완료";
      } catch (err) {
        cameraStatus.textContent = "카메라 권한을 허용해줘";
        alert("카메라 권한이 필요해. 주소창 왼쪽 자물쇠 아이콘에서 카메라 허용으로 바꿔줘.");
      }
    }

    function drawDefaultFrame() {
      stripCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);

      const gradient = stripCtx.createLinearGradient(0, 0, CANVAS_W, CANVAS_H);
      gradient.addColorStop(0, "#fff7ed");
      gradient.addColorStop(0.45, "#eff6ff");
      gradient.addColorStop(1, "#f5f3ff");
      stripCtx.fillStyle = gradient;
      stripCtx.fillRect(0, 0, CANVAS_W, CANVAS_H);

      stripCtx.fillStyle = "#172554";
      stripCtx.font = "900 70px Arial";
      stripCtx.textAlign = "center";
      stripCtx.fillText("JLS MARKET DAY", CANVAS_W / 2, 110);

      stripCtx.fillStyle = "#7c3aed";
      stripCtx.font = "800 34px Arial";
      stripCtx.fillText("LIFE 4 CUT PHOTO BOOTH", CANVAS_W / 2, 160);

      photoSlots.forEach((slot, idx) => {
        stripCtx.fillStyle = "#ffffff";
        roundRect(stripCtx, slot.x - 16, slot.y - 16, slot.w + 32, slot.h + 32, 32, true, false);
        stripCtx.fillStyle = "#e5e7eb";
        roundRect(stripCtx, slot.x, slot.y, slot.w, slot.h, 22, true, false);
        stripCtx.fillStyle = "#94a3b8";
        stripCtx.font = "900 44px Arial";
        stripCtx.fillText(String(idx + 1), slot.x + slot.w / 2, slot.y + slot.h / 2 + 15);
      });

      stripCtx.fillStyle = "#172554";
      stripCtx.font = "900 42px Arial";
      stripCtx.fillText("SEO SUWON JLS", CANVAS_W / 2, 1688);
      stripCtx.fillStyle = "#64748b";
      stripCtx.font = "700 26px Arial";
      stripCtx.fillText(new Date().toLocaleDateString("ko-KR"), CANVAS_W / 2, 1732);
    }

    function roundRect(ctx, x, y, w, h, r, fill, stroke) {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }

    function drawCoverImage(ctx, img, x, y, w, h, mirrored = false) {
      const iw = img.videoWidth || img.width;
      const ih = img.videoHeight || img.height;
      const scale = Math.max(w / iw, h / ih);
      const sw = w / scale;
      const sh = h / scale;
      const sx = (iw - sw) / 2;
      const sy = (ih - sh) / 2;

      ctx.save();
      if (mirrored) {
        ctx.translate(x + w, y);
        ctx.scale(-1, 1);
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
      } else {
        ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
      }
      ctx.restore();
    }

    function renderStrip() {
      drawDefaultFrame();

      photos.forEach((src, idx) => {
        const img = new Image();
        img.onload = () => {
          const slot = photoSlots[idx];
          stripCtx.save();
          roundRect(stripCtx, slot.x, slot.y, slot.w, slot.h, 22, false, false);
          stripCtx.clip();
          drawCoverImage(stripCtx, img, slot.x, slot.y, slot.w, slot.h, true);
          stripCtx.restore();

          if (idx === photos.length - 1 && frameImage) {
            stripCtx.drawImage(frameImage, 0, 0, CANVAS_W, CANVAS_H);
          }
        };
        img.src = src;
      });

      if (!photos.length && frameImage) {
        stripCtx.drawImage(frameImage, 0, 0, CANVAS_W, CANVAS_H);
      }
    }

    function updateThumbs() {
      thumbs.innerHTML = "";
      for (let i = 0; i < 4; i++) {
        const div = document.createElement("div");
        div.className = "thumb";
        if (photos[i]) {
          const img = document.createElement("img");
          img.src = photos[i];
          div.appendChild(img);
        }
        thumbs.appendChild(div);
      }
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function showCountdown() {
      for (const num of [3, 2, 1]) {
        countdownEl.textContent = num;
        countdownEl.classList.add("show");
        await wait(750);
        countdownEl.classList.remove("show");
        await wait(180);
      }
    }

    function fireFlash() {
      flashEl.classList.remove("on");
      void flashEl.offsetWidth;
      flashEl.classList.add("on");
    }

    function capturePhoto() {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      captureCanvas.width = vw;
      captureCanvas.height = vh;
      captureCtx.drawImage(video, 0, 0, vw, vh);
      return captureCanvas.toDataURL("image/jpeg", 0.95);
    }

    async function startShooting() {
      if (isShooting) return;
      if (!video.srcObject) {
        await initCamera();
      }

      isShooting = true;
      startBtn.disabled = true;
      saveBtn.disabled = true;
      printBtn.disabled = true;
      photos = [];
      updateThumbs();
      renderStrip();

      for (let i = 0; i < 4; i++) {
        cameraStatus.textContent = `${i + 1}번째 컷 준비`;
        await showCountdown();
        fireFlash();
        const photo = capturePhoto();
        photos.push(photo);
        updateThumbs();
        renderStrip();
        cameraStatus.textContent = `${i + 1}번째 컷 촬영 완료`;
        await wait(700);
      }

      await wait(450);
      renderStrip();
      saveBtn.disabled = false;
      printBtn.disabled = false;
      startBtn.disabled = false;
      isShooting = false;
      cameraStatus.textContent = "촬영 완료";
    }

    function resetPhotos() {
      photos = [];
      saveBtn.disabled = true;
      printBtn.disabled = true;
      updateThumbs();
      renderStrip();
      cameraStatus.textContent = "다시 촬영 가능";
    }

    function saveImage() {
      const link = document.createElement("a");
      const date = new Date();
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      const hh = String(date.getHours()).padStart(2, "0");
      const mm = String(date.getMinutes()).padStart(2, "0");
      link.download = `JLS-Market-Day-${y}${m}${d}-${hh}${mm}.png`;
      link.href = stripCanvas.toDataURL("image/png");
      link.click();
    }

    function printStrip() {
      window.print();
    }

    function loadFrameFromFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          frameImage = img;
          renderStrip();
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    function tryLoadDefaultFrame() {
      const img = new Image();
      img.onload = () => {
        frameImage = img;
        renderStrip();
      };
      img.onerror = () => {
        frameImage = null;
        renderStrip();
      };
      img.src = "frame.png?" + Date.now();
    }

    startBtn.addEventListener("click", startShooting);
    retakeBtn.addEventListener("click", resetPhotos);
    saveBtn.addEventListener("click", saveImage);
    printBtn.addEventListener("click", printStrip);
    frameInput.addEventListener("change", e => loadFrameFromFile(e.target.files[0]));

    drawDefaultFrame();
    updateThumbs();
    tryLoadDefaultFrame();
    initCamera();
  </script>
</body>
</html>
